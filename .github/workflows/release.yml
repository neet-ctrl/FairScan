name: Build Release APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed ARM64 Release APK
    runs-on: ubuntu-latest

    env:
      # These values are intentionally embedded so this workflow needs no
      # repository secrets. Keep the keystore file in this repository too.
      ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: attached_assets/my-release-key_1784922871544.jks
      ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: "Sh@090609"
      ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: my-key
      ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: "Sh@090609"
      ORG_GRADLE_PROJECT_releaseAbis: arm64-v8a

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache Gradle and Android build data
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Confirm release keystore is present
        run: test -f "$ORG_GRADLE_PROJECT_RELEASE_STORE_FILE"

      - name: Build signed ARM64 release APK
        run: >
          ./gradlew :app:assembleRelease
          --no-daemon
          --no-build-cache
          -x lint
          -x lintVitalRelease
          -x test
          -x check

      - name: Locate ARM64 APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/release -type f -name '*arm64-v8a.apk' ! -name '*-unsigned*' -print -quit)"
          test -n "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload release APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fairscan-arm64-v8a-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Get APK info
        id: apk-info
        shell: bash
        run: |
          APK_SIZE="$(stat -c%s "${{ steps.apk.outputs.path }}")"
          echo "apk_size=$(awk "BEGIN { printf \"%.2f MB\", $APK_SIZE / 1048576 }")" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: release-notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BODY="## FairScan v$VERSION – Build $GITHUB_RUN_NUMBER

          **Branch:** $GITHUB_REF_NAME
          **Commit:** \`$SHORT_SHA\`

          Signed release APK built only for the 64-bit ARM Android architecture.

          ### Package details
          | Field | Value |
          |---|---|
          | Version | $VERSION |
          | Build | $GITHUB_RUN_NUMBER |
          | ABI | arm64-v8a |
          | APK size | ${{ steps.apk-info.outputs.apk_size }} |
          | Minimum Android | 8.0 (API 26) |

          ### Installation
          Download the APK below, enable installation from unknown sources if prompted, and install it on an arm64 Android device."

          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-release
          name: FairScan Release Build ${{ github.run_number }}
          body: ${{ steps.release-notes.outputs.body }}
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}